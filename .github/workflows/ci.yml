name: CI

on:
  workflow_dispatch: { }
  pull_request: { }
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Compute fetch depth
        id: fetch-depth
        run: echo "depth=$(( ${{ github.event.pull_request.commits || 0 }} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ steps.fetch-depth.outputs.depth }}

      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@v3.0.0
        with:
          version: v4.0.2

      - name: Run linters
        run: ./scripts/lint.sh
        env:
          BASE_REF: ${{ github.base_ref }}
