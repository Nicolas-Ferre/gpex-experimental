name: CI

on:
  workflow_dispatch: { }
  pull_request: { }
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  check-pr-size:
    name: Check PR size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write # Add size label and comment
    steps:
      - uses: CodelyTV/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # v1.12.0
        with:
          xs_max_size: '10'
          s_max_size: '50'
          m_max_size: '150'
          l_max_size: '300'
          fail_if_xl: 'true'
          message_if_xl: >
            This PR exceeds the maximum size of 300 changed lines.
            Please split it into smaller PRs.

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch diff base
        id: diff-base
        run: |
          sha=$(./scripts/fetch_git_origin.sh)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        with:
          version: v4.0.2

      - name: Run linters
        run: ./scripts/lint.sh
        env:
          BASE_REF: ${{ steps.diff-base.outputs.sha }}
