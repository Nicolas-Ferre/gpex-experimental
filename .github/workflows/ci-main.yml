name: CI - main

on:
  workflow_dispatch: { }
  pull_request: { }
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch diff base
        id: diff-base
        run: |
          sha=$(./scripts/fetch_git_origin.sh)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        with:
          version: v4.0.2

      - name: Run linters
        run: ./scripts/lint.sh
        env:
          BASE_REF: ${{ steps.diff-base.outputs.sha }}
