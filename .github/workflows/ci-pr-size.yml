name: CI - PR size

on:
  pull_request:
    types: [ opened, synchronize, reopened, edited, labeled, unlabeled ]

env:
  MAX_PR_SIZE: 250
  # File lists: git glob pathspecs relative to repository root, one per line ("**/" matches subfolders).
  # Excluded files count 0. They win over reduced files.
  EXCLUDED_FILES: |
    **/Cargo.lock
  # Reduced files count REDUCED_FILES_WEIGHT per changed line.
  REDUCED_FILES: |
    test_cases/**
    doc/**
    .agents/skills/**
  REDUCED_FILES_WEIGHT: 0.25
  # PRs with this label pass whatever their counted size.
  LARGE_PR_LABEL: large-pr

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-size:
    name: Check PR size
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only valid for pull_request checkouts: HEAD is the merge commit and HEAD^1 the base branch tip.
          fetch-depth: 2
          persist-credentials: false

      - name: Check PR size
        shell: bash
        env:
          HAS_LARGE_PR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, env.LARGE_PR_LABEL) }}
        run: |
          to_list() { sed 's/^[[:space:]]*//; /^$/d' <<< "$1"; }
          mapfile -t excluded < <(to_list "$EXCLUDED_FILES")
          mapfile -t reduced < <(to_list "$REDUCED_FILES")

          diff_stats() { git diff --numstat -M HEAD^1 HEAD -- "$@" "${excluded[@]/#/:(exclude,glob)}"; }
          count_lines() { awk '{ lines += $1 + $2 } END { print lines + 0 }' <<< "$1"; }

          reduced_stats=""
          if (( ${#reduced[@]} > 0 )); then
            reduced_stats=$(diff_stats "${reduced[@]/#/:(glob)}")
          fi
          other_stats=$(diff_stats . "${reduced[@]/#/:(exclude,glob)}")

          echo "Reduced files (additions, deletions, path), weight $REDUCED_FILES_WEIGHT:"
          echo "$reduced_stats"
          echo "Other files (additions, deletions, path):"
          echo "$other_stats"

          size=$(awk \
            -v reduced="$(count_lines "$reduced_stats")" \
            -v other="$(count_lines "$other_stats")" \
            -v weight="$REDUCED_FILES_WEIGHT" \
            'BEGIN { printf "%d", other + reduced * weight }')

          echo "Counted size: $size (should be lower than $MAX_PR_SIZE)"
          if (( size >= MAX_PR_SIZE )); then
            if [[ "$HAS_LARGE_PR_LABEL" == true ]]; then
              echo "::warning::PR counted size is $size (should be lower than $MAX_PR_SIZE). Accepted thanks to the $LARGE_PR_LABEL label."
            else
              echo "::error::PR counted size is $size (should be lower than $MAX_PR_SIZE). Split it into smaller PRs, or add the $LARGE_PR_LABEL label if it is mechanical."
              exit 1
            fi
          fi
