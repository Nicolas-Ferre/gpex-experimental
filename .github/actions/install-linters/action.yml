name: Install linters
description: Install linters with the versions used by CI.

runs:
  using: composite
  steps:
    - name: Install editorconfig-checker
      uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
      with:
        version: v4.0.2

    - name: Install zizmor
      shell: bash
      run: pip install --require-hashes -r .github/requirements-lint.txt
